version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models/final_phase3
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend/models:/app/models

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
